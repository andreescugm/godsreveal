<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GOD'S REVEAL</title>
  <meta name="description" content="GOD'S REVEAL. Dos mundos: la Espada y el Cordero. Nada se muestra del todo. Todo se revela.">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Grenze+Gotisch:wght@600..900&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/img/angel.jpg">
  <link rel="preload" as="image" href="assets/img/sky.jpg">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/gate.css">
</head>
<body class="gate grain">

  <div class="veil" aria-hidden="true"><span class="veil__sheen"></span></div>

  <main class="gate__doors">
    <!-- arriba: la prueba -->
    <a class="door door--sword" href="espada.html" aria-label="Entrar en La Espada">
      <span class="door__media" aria-hidden="true"></span>
      <canvas class="atmos" data-atmos="smoke" aria-hidden="true"></canvas>
      <span class="door__inner">
        <span class="door__name holo--chrome" data-light>La Espada</span>
        <span class="door__line">Prueba. Fuego. Propósito. <span class="code">MT 10:34</span></span>
      </span>
    </a>

    <!-- centro: el velo -->
    <div class="seam" aria-hidden="true">
      <span class="seam__veil"></span>
      <span class="halo seam__halo"></span>
      <span class="glint seam__glint"></span>
    </div>
    <h1 class="gate__mark" aria-label="GOD'S REVEAL">
      <span class="glint glint--sm" aria-hidden="true"></span>
      <span class="holo--chrome" data-light>GOD'S REVEAL</span>
      <span class="glint glint--sm" aria-hidden="true"></span>
    </h1>

    <!-- abajo: la paz -->
    <a class="door door--lamb" href="cordero.html" aria-label="Entrar en El Cordero">
      <span class="door__media" aria-hidden="true"></span>
      <span class="door__inner">
        <span class="door__name holo" data-light data-text="El Cordero">El Cordero</span>
        <span class="door__line">Paz. Luz. Rebaño. <span class="code">JN 1:29</span></span>
      </span>
    </a>
  </main>

  <p class="gate__foot">Nada se muestra del todo. Todo se revela.</p>

  <script src="assets/js/site.js" defer></script>
</body>
</html>
